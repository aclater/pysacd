# A coarse, informational alarm for performance regressions (#123): base and head are built in
# one job and run pysacd-extract on synthetic discs, alternating, medians of 5
# (scripts/bench_compare.py). Never a required check, so the path filter is fine, and a flagged
# slowdown only warns. See docs/development.md.
name: benchmark

on:
  pull_request:
    paths:
      - "src/**"
      - "csrc/**"
      - "Makefile"
      - "scarletbook.lock"
      - "scripts/bench_compare.py"
      - "scripts/bench_workload.py"
      - ".github/workflows/benchmark.yml"

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true  # a new push supersedes the old run

permissions:
  contents: read

jobs:
  benchmark:
    name: benchmark (informational)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    container:
      # Fedora 44, pinned by digest: the build and the tests run in Red Hat-derived userland;
      # the runner (Ubuntu, GitHub's only hosted Linux) only hosts the container.
      image: registry.fedoraproject.org/fedora@sha256:b414c09be79dd1f32529b55b096b6bb30435d82ee16fbdbbabf8985eb5f86db0
    defaults:
      run:
        shell: bash
    steps:
      - name: Python 3.13 and the build packages (Fedora)
        env:
          PY: "3.13"
        run: |
          dnf -y -q --setopt=install_weak_deps=False install git-core gcc make flac-devel pkgconf-pkg-config findutils binutils diffutils file which \
            "/usr/bin/python$PY" "/usr/include/python$PY/Python.h"
          dnf clean all
          "python$PY" -m venv "$RUNNER_TEMP/venv"
          echo "$RUNNER_TEMP/venv/bin" >> "$GITHUB_PATH"
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 2  # a pull request's checkout is its merge commit: the first parent is the base

      - name: Install
        run: |
          git config --global --add safe.directory "$GITHUB_WORKSPACE"
          # hash-locked (tools/lock_dev.py)
          pip install --require-hashes -r requirements-dev.txt

      - name: Build base and head
        run: |
          git worktree add -q "$RUNNER_TEMP/base" HEAD^1
          make -C "$RUNNER_TEMP/base" PORTABLE=1
          make PORTABLE=1
          make test-tools

      - name: Generate the discs
        run: python3 -I scripts/bench_workload.py generate "$RUNNER_TEMP/discs"

      - name: Compare
        env:
          BENCH_DISCS: ${{ runner.temp }}/discs
        run: |
          python3 -I scripts/bench_compare.py --base "$RUNNER_TEMP/base" --head "$PWD" \
            --measure "python3 -I scripts/bench_workload.py" dst-stereo dst-multichannel plain-dsd
