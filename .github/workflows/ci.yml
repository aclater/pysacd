# CI: lint, type-check, build the C engine and run the tests.
name: ci

on:
  pull_request:
  push:
    branches: [master]

permissions:
  contents: read

jobs:
  lint-and-test:
    name: lint + tests (${{ matrix.python }})
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write   # Codecov upload with GitHub's OIDC token: no stored secret
    strategy:
      fail-fast: false
      matrix:
        python: ["3.11", "3.12", "3.13", "3.14"]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97  # v7.0.0
        with:
          python-version: ${{ matrix.python }}

      - name: Install build and dev dependencies
        # libflac-dev so the FLAC output path is compiled and tested too.
        run: |
          sudo apt-get update -q
          sudo apt-get install -y -q --no-install-recommends libflac-dev
          # hash-locked (tools/lock_dev.py); pysacd itself without build isolation, so the
          # locked setuptools builds it and nothing unhashed is downloaded (#14)
          pip install --require-hashes -r requirements-dev.txt
          pip install --no-deps --no-build-isolation -e .

      - name: ruff
        run: ruff check .

      - name: mypy
        run: mypy src

      - name: Build the engine (warnings are errors)
        # PORTABLE: no -march=native, so the runner's CPU doesn't matter.
        # libFLAC is optional: check that the engine also builds without it.
        run: |
          make PORTABLE=1 CFLAGS="-O2 -Werror" FLAC_LIBS= FLAC_CFLAGS=
          make clean
          make PORTABLE=1 CFLAGS="-O2 -Werror"
          make test-tools

      - name: The engine keeps the CET shadow-stack mark
        # x86-64 Linux: every object linked into it, scarletbook's included (0.5.2), is SHSTK-marked (#94)
        run: python3 -I tools/check_cet.py src/pysacd/_sacdconv*.so

      - name: Tests
        if: matrix.python != '3.13'
        run: PYTHONPATH=src pytest -q tests

      # One leg runs the suite under coverage.py (configured in pyproject.toml); the report goes
      # to the job summary, an artifact and Codecov. Python code only: the C engine is
      # covered by the sanitizer and fuzz jobs.
      - name: Tests under coverage
        if: matrix.python == '3.13'
        run: |
          PYTHONPATH=src coverage run -m pytest -q tests
          coverage report
          {
            echo "## Coverage (Python 3.13)"
            coverage report --format=markdown
          } >> "$GITHUB_STEP_SUMMARY"
          coverage html -d coverage-html
          coverage xml -o coverage.xml

      # Coverage also goes to Codecov for the README badge and PR comparisons, authenticated
      # with the job's OIDC token. Pull requests from forks get no token, so they skip it, and
      # an upload failure only fails CI on master, so a Codecov outage can't block PRs.
      - name: Upload coverage to Codecov
        if: matrix.python == '3.13' && (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository)
        uses: codecov/codecov-action@303a32d7a59b442fa8d48b6a1cc6825c09c847a5  # v7.1.1
        with:
          use_oidc: true
          files: coverage.xml
          disable_search: true
          fail_ci_if_error: ${{ github.event_name == 'push' }}

      - name: Upload the coverage report
        if: matrix.python == '3.13'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9  # v7.0.2
        with:
          name: coverage
          path: |
            coverage-html/
            coverage.xml
          retention-days: 14

  sanitizers:
    # The engine parses untrusted disc images: run the whole suite under
    # AddressSanitizer + UndefinedBehaviorSanitizer.
    name: tests under ASan + UBSan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97  # v7.0.0
        with:
          python-version: "3.13"

      - name: Install
        run: |
          sudo apt-get update -q
          sudo apt-get install -y -q --no-install-recommends libflac-dev
          # hash-locked (tools/lock_dev.py); pysacd itself without build isolation, so the
          # locked setuptools builds it and nothing unhashed is downloaded (#14)
          pip install --require-hashes -r requirements-dev.txt
          pip install --no-deps --no-build-isolation -e .

      - name: Build with sanitizers
        run: |
          SAN="-O1 -g -fno-omit-frame-pointer -fsanitize=address,undefined -fno-sanitize-recover=undefined"
          echo "SAN=$SAN" >> "$GITHUB_ENV"
          make PORTABLE=1 HARDEN=0 CFLAGS="$SAN"
          make test-tools CFLAGS="$SAN"

      - name: Tests
        # Python itself isn't instrumented: preload the runtimes and skip
        # leak checks (the interpreter keeps memory until exit).
        run: |
          export LD_PRELOAD="$(gcc -print-file-name=libasan.so):$(gcc -print-file-name=libubsan.so)"
          export ASAN_OPTIONS=detect_leaks=0:abort_on_error=1
          export UBSAN_OPTIONS=print_stacktrace=1:halt_on_error=1
          # tests/test_fuzz_engine.py builds the C fuzz harnesses with these flags too
          export PYSACD_FUZZ_CFLAGS="$SAN"
          PYTHONPATH=src python -m pytest -q tests

  tsan:
    # The engine hands batches between its reader, worker and writer threads: run the suite
    # under ThreadSanitizer too (#14).
    name: tests under TSan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97  # v7.0.0
        with:
          python-version: "3.13"

      - name: Install
        run: |
          sudo apt-get update -q
          sudo apt-get install -y -q --no-install-recommends libflac-dev
          pip install --require-hashes -r requirements-dev.txt
          pip install --no-deps --no-build-isolation -e .

      - name: Build with TSan
        run: |
          SAN="-O1 -g -fno-omit-frame-pointer -fsanitize=thread"
          make PORTABLE=1 HARDEN=0 CFLAGS="$SAN"
          make test-tools CFLAGS="$SAN"

      - name: Tests
        # TSan's shadow memory needs a smaller ASLR range than recent kernels default to.
        # Python isn't instrumented, so the runtime is preloaded.
        run: |
          sudo sysctl -w vm.mmap_rnd_bits=28
          export LD_PRELOAD="$(gcc -print-file-name=libtsan.so.2)"   # the runtime, not the linker script
          # Reports go to a file: pytest captures stderr, and halt_on_error exits before it can print it.
          # Rust code in the scarletbook library isn't instrumented: tests/tsan.supp says why
          export TSAN_OPTIONS=halt_on_error=1:second_deadlock_stack=1:log_path=$RUNNER_TEMP/tsan:suppressions=$PWD/tests/tsan.supp
          # numpy's OpenBLAS threads race in their own uninstrumented code (seen in CI); one
          # thread keeps TSan on pysacd's engine
          export OPENBLAS_NUM_THREADS=1
          # Without the runtime the engine doesn't load and its tests would silently skip.
          PYTHONPATH=src python -c "from pysacd import _native; _native._load()"
          PYTHONPATH=src python -m pytest -v tests || { cat "$RUNNER_TEMP"/tsan* 2>/dev/null; exit 1; }

  oracle:
    # Build the real sacd_extract from a pinned sacd-ripper commit and run the
    # tests that compare against it (synthetic DST ISOs: original == pysacd ==
    # sacd_extract).  sacd-ripper's code exists only in this runner, never in
    # the repository.
    name: compare with sacd_extract
    runs-on: ubuntu-latest
    env:
      SACD_RIPPER_REPO: https://github.com/sacd-ripper/sacd-ripper.git
      SACD_RIPPER_COMMIT: a3d981c935c3224217e2842cd492f9351106c81e
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97  # v7.0.0
        with:
          python-version: "3.13"

      - name: Install
        run: |
          sudo apt-get update -q
          sudo apt-get install -y -q --no-install-recommends libflac-dev cmake
          # hash-locked (tools/lock_dev.py); pysacd itself without build isolation, so the
          # locked setuptools builds it and nothing unhashed is downloaded (#14)
          pip install --require-hashes -r requirements-dev.txt
          pip install --no-deps --no-build-isolation -e .
          make PORTABLE=1
          make test-tools

      - name: Build sacd_extract
        # The upstream tree predates current CMake and GCC defaults.
        run: |
          git init -q "$RUNNER_TEMP/sacd-ripper"
          cd "$RUNNER_TEMP/sacd-ripper"
          git fetch -q --depth 1 "$SACD_RIPPER_REPO" "$SACD_RIPPER_COMMIT"
          git checkout -q FETCH_HEAD
          CFLAGS="-std=gnu17 -Wno-error=incompatible-pointer-types -Wno-error=int-conversion -Wno-error=implicit-function-declaration" \
            cmake -S tools/sacd_extract -B build -DCMAKE_BUILD_TYPE=Release -DCMAKE_POLICY_VERSION_MINIMUM=3.5 >/dev/null
          make -s -C build -j"$(nproc)"
          echo "SACD_EXTRACT=$RUNNER_TEMP/sacd-ripper/build/sacd_extract" >> "$GITHUB_ENV"

      - name: Tests against sacd_extract
        run: PYTHONPATH=src:tests python -m pytest -q tests/test_dst_full.py tests/test_sbcompat.py

  scarletbook:
    # The engine links the scarletbook-rs C library pinned in scarletbook.lock (#85); every build
    # checks its download against the SHA-256 pinned there. This checks the pins themselves: each
    # archive must carry a signed build provenance attestation from scarletbook-rs's release
    # workflow, for the pinned tag and commit. A pin that isn't an attested release fails here.
    name: scarletbook provenance
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false

      - name: Check every pinned archive's digest and attestation
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 -I tools/scarletbook.py attest --dir "$RUNNER_TEMP/scarletbook"

  privacy:
    # The repository must not carry hostnames or home-network names, in files
    # or in commit identities.  The generic pattern is always checked; extra
    # names come from the PRIVATE_NAMES repository variable (a regex), so
    # they never appear in the repository themselves.
    name: no private names
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0

      - name: Scan files and commit identities
        env:
          PRIVATE_NAMES: ${{ vars.PRIVATE_NAMES }}
          BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before }}
        run: bash scripts/check-private-names.sh
