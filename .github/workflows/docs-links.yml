# Check the links in README.md and docs/ with lychee: relative links to files,
# and external ones, with their #fragments (headings in the linked file). Weekly (links rot without a code change) and on pull
# requests that touch the docs. The shared DSD Toolbox link check (docs-links job) also covers every
# other Markdown file (CHANGELOG, CONTRIBUTING, SECURITY), offline on pull requests and with external
# URLs weekly.

name: docs-links

on:
  pull_request:
    paths: ["**.md", ".docs.toml", ".github/workflows/docs-links.yml"]
  schedule:
    - cron: "11 7 * * 1"  # weekly
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.event_name == 'pull_request' && github.ref || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}  # a new push supersedes the old PR run; main runs finish

permissions:
  contents: read

jobs:
  lychee:
    name: docs links
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false

      # The README's icon uses an absolute raw URL so it renders on package
      # indexes; it points at this repo's own docs/assets/ and is excluded.
      # Excluded: pages behind a MusicBrainz login, and badge images (generated
      # on request, and the Scorecard badge doesn't exist before its first run).
      - uses: lycheeverse/lychee-action@e7477775783ea5526144ba13e8db5eec57747ce8  # v2.9.0
        with:
          args: >-
            --no-progress --max-concurrency 4 --max-retries 3 --include-fragments
            --exclude '^https://musicbrainz\.org/account/'
            --exclude '^https://api\.scorecard\.dev/'
            --exclude '^https://img\.shields\.io/'
            --exclude '^https://raw\.githubusercontent\.com/dsd-toolbox/pysacd/master/docs/assets/'
            README.md 'docs/**/*.md'
          fail: true

  docs-links:
    permissions:
      contents: read
    uses: dsd-toolbox/dsd-toolbox/.github/workflows/docs-links.yml@b50a7cca297022561959ba9a2532c0673d532ada
    with:
      tools_ref: b50a7cca297022561959ba9a2532c0673d532ada
      external: ${{ github.event_name != 'pull_request' }}
