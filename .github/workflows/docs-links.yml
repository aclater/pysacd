# The shared DSD Toolbox link check (dsd-toolbox docs/docs-tooling.md): every link in every Markdown
# file (README, docs/, CHANGELOG, CONTRIBUTING, SECURITY), relative links, links into this repository
# and #anchors, offline on pull requests. The weekly run and a manual run also fetch every
# external URL (links rot without a change here). Settings are in .docs.toml.

name: docs-links

on:
  pull_request:
    paths: ["**.md", ".docs.toml", ".github/workflows/docs-links.yml"]
  schedule:
    - cron: "11 7 * * 1"  # weekly
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.event_name == 'pull_request' && github.ref || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}  # a new push supersedes the old PR run; master runs finish

permissions: {}

jobs:
  docs-links:
    permissions:
      contents: read
    uses: dsd-toolbox/dsd-toolbox/.github/workflows/docs-links.yml@33e1b0308e4bb9890701d5e3bb857c9ce9fe110f
    with:
      tools_ref: 33e1b0308e4bb9890701d5e3bb857c9ce9fe110f
      external: ${{ github.event_name != 'pull_request' }}
