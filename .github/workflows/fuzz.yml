# Fuzz pysacd's engine on hostile disc images (#36, #85): fuzz/fuzz_engine.c runs
# sacdconv_area_run() on each input, with libFuzzer under ASan + UBSan. The image parsing
# itself (TOC, sectors, DST) is scarletbook-rs's, fuzzed in its own repository; this covers
# pysacd's reader, batches, workers and writers around it. Pull requests get a short run; the
# weekly run is longer and keeps its corpus in the cache. A crash fails the job and uploads
# the input; minimise it and add it to fuzz/regressions/fuzz_engine/.

name: fuzz

on:
  pull_request:
    paths: ["csrc/**", "fuzz/**", "tests/sacdgen.py", "scarletbook.lock", ".github/workflows/fuzz.yml"]
  schedule:
    - cron: "17 3 * * 1"
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.event_name == 'pull_request' && github.ref || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}  # a new push supersedes the old PR run; main runs finish

permissions:
  contents: read

jobs:
  fuzz:
    name: libFuzzer (${{ matrix.harness }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        harness: [engine]
    env:
      SECONDS_PER_RUN: ${{ github.event_name == 'pull_request' && 120 || 1800 }}
    container:
      # Fedora 44, pinned by digest: the build and the tests run in Red Hat-derived userland;
      # the runner (Ubuntu, GitHub's only hosted Linux) only hosts the container.
      image: registry.fedoraproject.org/fedora@sha256:b414c09be79dd1f32529b55b096b6bb30435d82ee16fbdbbabf8985eb5f86db0
    defaults:
      run:
        shell: bash
    steps:
      - name: Python 3.13 and the build packages (Fedora)
        env:
          PY: "3.13"
        run: |
          dnf -y -q --setopt=install_weak_deps=False install git-core gcc make flac-devel pkgconf-pkg-config findutils binutils diffutils file which clang compiler-rt \
            "/usr/bin/python$PY" "/usr/include/python$PY/Python.h"
          dnf clean all
          "python$PY" -m venv "$RUNNER_TEMP/venv"
          echo "$RUNNER_TEMP/venv/bin" >> "$GITHUB_PATH"
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false

      - name: Build the harness and the seed corpus
        # the seed generator uses the tests' DST encoder, which needs numpy
        run: |
          python -m pip install --require-hashes -r requirements-test.txt   # hash-locked (#14)
          make fuzz
          make test-tools
          PYTHONPATH=src:tests python fuzz/make_seeds.py build/fuzz-seeds

      - name: Restore the corpus
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9  # v6.1.0
        with:
          path: build/fuzz-corpus/${{ matrix.harness }}
          key: fuzz-corpus-${{ matrix.harness }}-${{ github.run_id }}
          restore-keys: fuzz-corpus-${{ matrix.harness }}-

      - name: Fuzz
        run: |
          mkdir -p build/fuzz-corpus/${{ matrix.harness }} build/fuzz-crash
          # the seed images are up to 2 MB; libFuzzer's default length limit would cut them
          build/fuzz_${{ matrix.harness }} -jobs="$(nproc)" -workers="$(nproc)" -max_total_time="$SECONDS_PER_RUN" \
            -max_len=4194304 -timeout=60 \
            -artifact_prefix=build/fuzz-crash/ -print_final_stats=1 \
            build/fuzz-corpus/${{ matrix.harness }} build/fuzz-seeds/${{ matrix.harness }} \
            fuzz/regressions/fuzz_${{ matrix.harness }}
          # With -jobs, a worker's crash doesn't reach the exit status: look for its input.
          if [ -n "$(ls -A build/fuzz-crash)" ]; then
            tail -n 60 fuzz-*.log
            echo "::error::libFuzzer found crashing inputs (uploaded as an artifact)"
            exit 1
          fi

      - name: Upload crashing inputs
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9  # v7.0.2
        with:
          name: fuzz-crash-${{ matrix.harness }}
          path: build/fuzz-crash/
