# Build and test the engine on macOS and Windows (#8), which ci.yml doesn't cover.
# Runs when code or tests change, and weekly. (Free on the public repository.)

name: portability

on:
  pull_request:
    paths: ["csrc/**", "Makefile", "setup.py", "src/**", "tests/**", "fuzz/**",
            ".github/workflows/portability.yml"]
  schedule:
    - cron: "41 4 * * 1"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  macos:
    name: tests (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97  # v7.0.0
        with:
          python-version: "3.13"

      - name: Install
        run: |
          brew install flac pkg-config
          python -m pip install --upgrade pip
          pip install -e '.[dev]'

      - name: Build the engine (warnings are errors)
        run: |
          make clean
          make CFLAGS="-O2 -Werror"
          make test-tools
          python -m pysacd --version

      - name: Tests
        run: PYTHONPATH=src pytest -q tests

  windows:
    # MinGW-w64 (MSYS2 UCRT64) builds the DLL, linked statically; the tests run
    # under the regular python.org-style CPython that users have.
    name: tests (windows-latest)
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97  # v7.0.0
        with:
          python-version: "3.13"

      - uses: msys2/setup-msys2@ec48f7c5447b3140e2b088413ae3a55687bccb6e  # v2.33.0
        with:
          msystem: UCRT64
          install: >-
            make
            mingw-w64-ucrt-x86_64-gcc
            mingw-w64-ucrt-x86_64-pkgconf
            mingw-w64-ucrt-x86_64-flac

      - name: Build the engine (warnings are errors)
        shell: msys2 {0}
        run: |
          make CFLAGS="-O2 -Werror"
          make test-tools
          objdump -p src/pysacd/_sacdconv.dll | grep "DLL Name"

      - name: Tests
        shell: bash
        env:
          PYTHONPATH: src
          PYTHONUTF8: "1"
        run: |
          # the dev extras from pyproject.toml; `pip install -e .` would need make on PATH
          python -m pip install --upgrade pip
          python -m pip install mutagen numpy pytest==9.1.1
          python -m pysacd --version
          python -m pytest -q tests
