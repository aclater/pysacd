# Build and test the engine on macOS and Windows (#8), which ci.yml doesn't cover.
# Runs when code or tests change, and weekly. (Free on the public repository.)

name: portability

on:
  pull_request:
    paths: ["csrc/**", "Makefile", "setup.py", "src/**", "tests/**", "fuzz/**", "scarletbook.lock",
            "tools/scarletbook.py", ".github/workflows/portability.yml"]
  schedule:
    - cron: "41 4 * * 1"
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.event_name == 'pull_request' && github.ref || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}  # a new push supersedes the old PR run; main runs finish

permissions:
  contents: read

jobs:
  macos:
    name: tests (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97  # v7.0.0
        with:
          python-version: "3.13"

      - name: Install
        run: |
          brew install flac pkg-config
          pip install --require-hashes -r requirements-dev.txt     # hash-locked (#14)
          pip install --no-deps --no-build-isolation -e .

      - name: Build the engine (warnings are errors)
        run: |
          make clean
          make CFLAGS="-O2 -Werror"
          make test-tools
          python -m pysacd --version

      - name: Tests
        run: PYTHONPATH=src pytest -q tests

  windows:
    # MinGW-w64 (MSYS2 UCRT64) builds the DLL, linked statically; the tests run
    # under the regular python.org-style CPython that users have.
    name: tests (windows-latest)
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97  # v7.0.0
        with:
          python-version: "3.13"

      - uses: msys2/setup-msys2@ec48f7c5447b3140e2b088413ae3a55687bccb6e  # v2.33.0
        with:
          msystem: UCRT64
          install: >-
            make
            mingw-w64-ucrt-x86_64-gcc
            mingw-w64-ucrt-x86_64-pkgconf
            mingw-w64-ucrt-x86_64-flac

      # The MSYS2 shell has no Python of its own: fetch the scarletbook library (#85) with the
      # runner's, so that make finds it in place
      - name: Fetch the scarletbook library
        shell: bash
        run: python -I tools/scarletbook.py fetch --target x86_64-pc-windows-gnu --dest build/scarletbook

      - name: Build the engine (warnings are errors)
        shell: msys2 {0}
        run: |
          make CFLAGS="-O2 -Werror"
          make test-tools
          objdump -p src/pysacd/_sacdconv.dll | grep "DLL Name"
          # exports: the engine's functions and scarletbook's C ABI, nothing of Rust's runtime
          objdump -p src/pysacd/_sacdconv.dll | sed -n '/Ordinal\/Name Pointer/,/^$/p' | grep -E '^\s*\[ *[0-9]+\]' | awk '{print $NF}' > exports.txt
          grep -c '^sb_' exports.txt
          ! grep -v -e '^sb_' -e '^sacdconv_' exports.txt

      - name: Tests
        shell: bash
        env:
          PYTHONPATH: src
          PYTHONUTF8: "1"
        run: |
          # the test dependencies, hash-locked (#14); `pip install -e .` would need make on PATH
          python -m pip install --require-hashes -r requirements-test.txt
          python -m pysacd --version
          python -m pytest -q tests
