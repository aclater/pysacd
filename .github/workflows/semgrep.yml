# Pattern-based static analysis with the community rule packs for the
# languages this repo ships: Python, C and the workflows themselves.  Any
# finding fails the check; intentional exceptions are suppressed inline with
# `nosemgrep` and a reason.  Runs locally with the same pinned version:
#
#   python3 -m venv /tmp/sg && /tmp/sg/bin/pip install --require-hashes \
#     -r .github/requirements/semgrep.txt && /tmp/sg/bin/semgrep scan --metrics=off --error \
#       --config p/python --config p/c --config p/github-actions

name: semgrep

on:
  pull_request:
  push:
    branches: [master]

concurrency:
  group: ${{ github.workflow }}-${{ github.event_name == 'pull_request' && github.ref || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}  # a new push supersedes the old PR run; main runs finish

permissions:
  contents: read

jobs:
  scan:
    runs-on: ubuntu-latest
    container:
      # UBI 10 (ubi10/ubi 10.3), pinned by digest; the tool comes from PyPI, pinned by hash.
      image: registry.access.redhat.com/ubi10/ubi@sha256:1e9193f051ac70582821c8a941325c5053488c54c75cd0c31b577d871ac29dba
    defaults:
      run:
        shell: bash
    steps:
      - name: Packages
        run: dnf -y -q --setopt=install_weak_deps=False install git-core python3-pip && dnf clean all
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false

      # semgrep from PyPI, pinned by version and hash (.github/requirements/semgrep.txt),
      # in place of the vendor's container image.
      - name: Install semgrep
        run: |
          python3 -m venv "$RUNNER_TEMP/semgrep"
          "$RUNNER_TEMP/semgrep/bin/pip" install -q --require-hashes -r .github/requirements/semgrep.txt
          echo "$RUNNER_TEMP/semgrep/bin" >> "$GITHUB_PATH"
          git config --global --add safe.directory "$GITHUB_WORKSPACE"

      - name: semgrep scan
        # Private repository without code scanning: findings print in the log
        # and fail the job instead of being uploaded.
        run: |
          semgrep scan --metrics=off --error \
            --config p/python --config p/c --config p/github-actions
