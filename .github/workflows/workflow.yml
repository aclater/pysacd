# Build wheels and the sdist (#9). Pull requests that touch packaging or the
# engine build them as a check; a v* tag also attests them, attaches them to a
# GitHub release, and publishes them: to TestPyPI first, then PyPI, each only
# when its repository variable (TESTPYPI_PUBLISH, PYPI_PUBLISH) is "true" and
# trusted publishing is configured for its environment (testpypi, pypi).

name: wheels (release)

on:
  pull_request:
    paths: ["setup.py", "pyproject.toml", "MANIFEST.in", "Makefile", "csrc/**", "tests/wheel_smoke.py",
            "scarletbook.lock", "tools/scarletbook.py", "tools/check_cet.py", "tools/check_release_tag.py",
            "src/pysacd/__init__.py", "licenses/**", ".github/workflows/workflow.yml"]
  push:
    tags: ["v*"]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.event_name == 'pull_request' && github.ref || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}  # a new push supersedes the old PR run; main runs finish

permissions:
  contents: read

# libFLAC for the macOS wheels, built from its release source (#142): Homebrew's bottles target the
# runner's macOS, which made the wheels macOS 15 only. The SHA-256 is the same from downloads.xiph.org,
# the GitHub release and Homebrew's formula.
env:
  FLAC_VERSION: "1.5.0"
  FLAC_SHA256: f2c1c76592a82ffff8413ba3c4a1299b6c7ab06c734dee03fd88630485c2b920

jobs:
  tag:
    # First, before anything is built: a v* tag must be "v" plus the package version, on a commit
    # of master or a release/* branch (#154). Tags can't be moved afterwards. Pull requests and
    # manual runs only check that pyproject.toml and __version__ agree.
    name: release tag
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0  # every branch of origin, to see which ones hold the commit

      - name: The tag matches the version and its commit is on a release branch
        env:
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
        run: >-
          python3 -I tools/check_release_tag.py --ref "$GITHUB_REF" --sha "$GITHUB_SHA"
          --default-branch "$DEFAULT_BRANCH"

  scarletbook:
    # Every wheel links the scarletbook-rs C library pinned in scarletbook.lock (#85), and each
    # build checks its download against the pinned SHA-256. Before building, check that every
    # pinned archive is an attested scarletbook-rs release (tag and commit), as ci.yml does.
    name: scarletbook provenance
    needs: [tag]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false

      - name: Check every pinned archive's digest and attestation
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 -I tools/scarletbook.py attest --dir "$RUNNER_TEMP/scarletbook"

  wheels:
    name: wheel (${{ matrix.name }})
    needs: [scarletbook]
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - {name: manylinux x86_64, os: ubuntu-latest, build: "cp313-manylinux_*"}
          - {name: manylinux aarch64, os: ubuntu-24.04-arm, build: "cp313-manylinux_*"}
          - {name: musllinux x86_64, os: ubuntu-latest, build: "cp313-musllinux_*"}
          # the oldest macOS each architecture's Python and scarletbook library support (#142)
          - {name: macOS arm64, os: macos-15, build: "cp313-macosx_arm64", target: "11.0"}
          - {name: macOS x86_64, os: macos-15-intel, build: "cp313-macosx_x86_64", target: "10.13"}
          - {name: Windows x86_64, os: windows-latest, build: "cp313-win_amd64"}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false

      # Windows: the engine is built with MinGW-w64 (MSYS2 UCRT64), linked statically.
      - uses: msys2/setup-msys2@ec48f7c5447b3140e2b088413ae3a55687bccb6e  # v2.33.0
        if: runner.os == 'Windows'
        id: msys2
        with:
          msystem: UCRT64
          install: >-
            make
            mingw-w64-ucrt-x86_64-gcc
            mingw-w64-ucrt-x86_64-pkgconf
            mingw-w64-ucrt-x86_64-flac

      - name: Put the MinGW toolchain on PATH (Windows)
        if: runner.os == 'Windows'
        shell: bash
        env:
          # through the environment, not expanded into the script (zizmor: template-injection)
          MSYS2_LOCATION: ${{ steps.msys2.outputs.msys2-location }}
        run: |
          root=$(cygpath -u "$MSYS2_LOCATION")
          echo "$(cygpath -w "$root/ucrt64/bin")" >> "$GITHUB_PATH"
          echo "$(cygpath -w "$root/usr/bin")" >> "$GITHUB_PATH"

      # A static libFLAC (no Ogg, no programs) for the wheel's minimum macOS, linked into the engine,
      # so delocate has nothing to bundle. Same libFLAC release as Homebrew's.
      - name: Build libFLAC from source (macOS)
        if: runner.os == 'macOS'
        env:
          MACOSX_DEPLOYMENT_TARGET: ${{ matrix.target }}
        run: |
          brew install pkg-config
          curl -fsSL -o "$RUNNER_TEMP/flac.tar.xz" \
            "https://github.com/xiph/flac/releases/download/$FLAC_VERSION/flac-$FLAC_VERSION.tar.xz"
          echo "$FLAC_SHA256  $RUNNER_TEMP/flac.tar.xz" | shasum -a 256 -c -
          tar -xf "$RUNNER_TEMP/flac.tar.xz" -C "$RUNNER_TEMP"
          cmake -S "$RUNNER_TEMP/flac-$FLAC_VERSION" -B "$RUNNER_TEMP/flac-build" -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_INSTALL_PREFIX="$RUNNER_TEMP/flac" -DCMAKE_OSX_DEPLOYMENT_TARGET="$MACOSX_DEPLOYMENT_TARGET" \
            -DCMAKE_POSITION_INDEPENDENT_CODE=ON -DBUILD_SHARED_LIBS=OFF -DWITH_OGG=OFF -DBUILD_CXXLIBS=OFF \
            -DBUILD_PROGRAMS=OFF -DBUILD_EXAMPLES=OFF -DBUILD_TESTING=OFF -DBUILD_DOCS=OFF -DINSTALL_MANPAGES=OFF
          cmake --build "$RUNNER_TEMP/flac-build" -j "$(sysctl -n hw.ncpu)"
          cmake --install "$RUNNER_TEMP/flac-build"
          echo "PKG_CONFIG_PATH=$RUNNER_TEMP/flac/lib/pkgconfig" >> "$GITHUB_ENV"

      - name: Build
        uses: pypa/cibuildwheel@f9b966cfadf4109556cadc5bb39ddb72d0ce664e  # v4.3.5
        env:
          # The engine is loaded through ctypes, so one py3-none wheel per platform
          # serves every Python: build it once.
          CIBW_BUILD: ${{ matrix.build }}
          CIBW_ARCHS_LINUX: native
          # libFLAC for FLAC output; auditwheel / delocate then bundle it into the wheel.
          CIBW_BEFORE_ALL_LINUX: >-
            if command -v apk >/dev/null; then apk add flac-dev pkgconf;
            else dnf install -y dnf-plugins-core &&
            (dnf config-manager --set-enabled powertools || dnf config-manager --set-enabled crb) &&
            dnf install -y flac-devel; fi
          # The wheel's minimum macOS (#142); libFLAC above and scarletbook's library target it or older.
          MACOSX_DEPLOYMENT_TARGET: ${{ matrix.target }}
          # The Windows DLL is static: nothing to bundle.
          CIBW_REPAIR_WHEEL_COMMAND_WINDOWS: ""
          # A clean environment: install the wheel and convert a synthetic disc with it.
          CIBW_TEST_COMMAND: python {project}/tests/wheel_smoke.py

      # scarletbook-rs 0.5.2's x86-64 Linux library carries the CET shadow-stack mark, so the
      # engine does too; keep it so in the x86-64 glibc wheel, after auditwheel (#94). Not musl:
      # Alpine's own startup objects (crti.o, crtbeginS.o) carry no CET mark, and musl never
      # turns shadow stacks on, so a mark there would change nothing.
      - name: The engine keeps the CET shadow-stack mark (x86-64 manylinux)
        if: runner.os == 'Linux' && runner.arch == 'X64' && contains(matrix.build, 'manylinux')
        run: python3 -I tools/check_cet.py wheelhouse/*.whl

      # The tag and the engine's own minimum (LC_BUILD_VERSION) both say the target, and the engine
      # links no library outside the system (#142).
      - name: The wheel's minimum macOS (macOS)
        if: runner.os == 'macOS'
        env:
          TARGET: ${{ matrix.target }}
        run: |
          set -eu
          whl=$(ls wheelhouse/*.whl)
          tag="macosx_$(echo "$TARGET" | tr . _)_$(uname -m)"
          case "$whl" in *"$tag.whl") echo "tag: $tag" ;; *) echo "::error::$whl is not $tag"; exit 1 ;; esac
          mkdir "$RUNNER_TEMP/whl" && unzip -q "$whl" -d "$RUNNER_TEMP/whl"
          lib="$RUNNER_TEMP/whl/pysacd/_sacdconv.dylib"
          minos=$(otool -l "$lib" | awk '/LC_BUILD_VERSION/{f=1} f&&$1=="minos"{print $2; exit}')
          [ -n "$minos" ] || minos=$(otool -l "$lib" | awk '/LC_VERSION_MIN_MACOSX/{f=1} f&&$1=="version"{print $2; exit}')
          echo "engine minos: $minos"
          [ "$minos" = "$TARGET" ] || { echo "::error::engine minos $minos, not $TARGET"; exit 1; }
          otool -L "$lib"
          # (otool -L also lists the engine's own install name)
          if otool -L "$lib" | tail -n +2 | grep -v -e /usr/lib/ -e /System/Library/ -e '/_sacdconv\.dylib '; then
            echo "::error::the engine links a library outside the system"; exit 1
          fi

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9  # v7.0.2
        with:
          name: wheel-${{ matrix.os }}-${{ strategy.job-index }}
          path: wheelhouse/*.whl

  sdist:
    needs: [scarletbook]
    runs-on: ubuntu-latest
    container:
      # Fedora 44, pinned by digest: the sdist is built and checked in Red Hat-derived userland.
      image: registry.fedoraproject.org/fedora@sha256:b414c09be79dd1f32529b55b096b6bb30435d82ee16fbdbbabf8985eb5f86db0
    defaults:
      run:
        shell: bash
    steps:
      - name: Python 3.13 and the build packages (Fedora)
        run: |
          dnf -y -q --setopt=install_weak_deps=False install git-core gcc make flac-devel pkgconf-pkg-config \
            findutils binutils diffutils file which python3.13 python3.13-devel
          dnf clean all
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false

      # build, the backend and pysacd's dependencies all come from the hash-locked
      # requirements-dev.txt (#14), so nothing unhashed is downloaded (#70).
      - name: Install the build tools
        run: |
          python3.13 -m venv /tmp/sdist-check
          /tmp/sdist-check/bin/pip install -q --require-hashes -r requirements-dev.txt

      - name: Build the sdist
        run: /tmp/sdist-check/bin/python -m build --sdist --no-isolation

      - name: The sdist builds a working package
        run: |
          # a wheel built from the sdist alone, then installed without fetching anything;
          # pip check fails if it declares a dependency the lock doesn't provide
          /tmp/sdist-check/bin/python -m pip wheel -q --no-deps --no-build-isolation -w /tmp/sdist-wheel dist/*.tar.gz
          /tmp/sdist-check/bin/pip install -q --no-deps /tmp/sdist-wheel/*.whl
          /tmp/sdist-check/bin/pip check
          PATH=/tmp/sdist-check/bin:$PATH /tmp/sdist-check/bin/python tests/wheel_smoke.py

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9  # v7.0.2
        with:
          name: sdist
          path: dist/*.tar.gz

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [wheels, sdist]
    runs-on: ubuntu-latest
    permissions:
      contents: write
      id-token: write
      attestations: write
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333  # v8.0.2
        with:
          path: dist
          merge-multiple: true

      - name: Build provenance attestations
        id: attest
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8  # v4.2.2
        with:
          subject-path: dist/*

      # The attestation also goes on the release as <artifact>.intoto.jsonl, one per
      # artifact (the same bundle covers them all), so it can be checked offline and
      # OpenSSF Scorecard sees signed releases (#70). Each copy is verified first.
      - name: Provenance bundles
        env:
          GH_TOKEN: ${{ github.token }}
          BUNDLE: ${{ steps.attest.outputs.bundle-path }}
        run: |
          mkdir provenance
          for f in dist/*; do
            b="provenance/$(basename "$f").intoto.jsonl"
            cp "$BUNDLE" "$b"
            gh attestation verify "$f" --bundle "$b" --repo "$GITHUB_REPOSITORY" \
              --signer-workflow "$GITHUB_REPOSITORY/.github/workflows/workflow.yml"
          done

      - name: Attach to the GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
        run: |
          gh release view "$TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1 ||
            gh release create "$TAG" --repo "$GITHUB_REPOSITORY" --title "$TAG" --notes "pysacd $TAG"
          gh release upload "$TAG" dist/* provenance/* --repo "$GITHUB_REPOSITORY" --clobber

  testpypi:
    if: startsWith(github.ref, 'refs/tags/v') && vars.TESTPYPI_PUBLISH == 'true'
    needs: [release]
    runs-on: ubuntu-latest
    environment: testpypi
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333  # v8.0.2
        with:
          path: dist
          merge-multiple: true

      - uses: pypa/gh-action-pypi-publish@7245906fb61fa33a13554f9d5fb856fe61758086  # v1.14.3
        with:
          repository-url: https://test.pypi.org/legacy/

  pypi:
    # TestPyPI first when it's enabled; PyPI follows only if that succeeded (or was skipped).
    if: >-
      always() && startsWith(github.ref, 'refs/tags/v') && vars.PYPI_PUBLISH == 'true' &&
      needs.release.result == 'success' && needs.testpypi.result != 'failure'
    needs: [release, testpypi]
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333  # v8.0.2
        with:
          path: dist
          merge-multiple: true

      - uses: pypa/gh-action-pypi-publish@7245906fb61fa33a13554f9d5fb856fe61758086  # v1.14.3
