  "comment": "dsd2pcm's C library, which pysacd links statically for PCM conversion (its precise and pysacd filters). pysacd requires dsd2pcm 0.2.0 or later ('min_version'; tools/dsd2pcm.py and the engine refuse older). tools/dsd2pcm.py builds it from the release's C library source archive ('source.archive': 'capi-src', libdsd2pcm-<version>-src.tar.gz, made from 'source.ref': a tag, or a commit before the release is tagged), checked against its SHA-256 and built offline, without the FLAC reader, so that nothing outside Rust's standard library is linked, with the pinned Rust toolchain. 'use_archives': true would take the release's C library archives instead where it has one for the target (digests in 'assets'); off until they ship without the FLAC reader and with CET marks. See docs/development.md, 'The dsd2pcm library'.",
