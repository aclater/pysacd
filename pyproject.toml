[build-system]
requires = ["setuptools>=64"]
build-backend = "setuptools.build_meta"

[project]
name = "pysacd"
version = "0.5.0"
description = "SACD (Scarletbook) ISO reader and DSF/FLAC converter"
readme = "README.md"
requires-python = ">=3.10"
license = "GPL-2.0-or-later"
license-files = ["COPYING", "licenses/*"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "Intended Audience :: End Users/Desktop",
    "Operating System :: MacOS",
    "Operating System :: Microsoft :: Windows",
    "Operating System :: POSIX :: Linux",
    "Programming Language :: C",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Programming Language :: Python :: 3.15",
    "Topic :: Multimedia :: Sound/Audio :: Conversion",
]
# mutagen: tags for convert and pysacd-extract --musicbrainz; tomli: the config file on Python 3.10
dependencies = ["mutagen>=1.45", "tomli>=1.1; python_version < '3.11'"]

[project.optional-dependencies]
convert = []        # kept so `pip install pysacd[convert]` still works; mutagen is a dependency now
# ruff and mypy are pinned: an unpinned upgrade can change the rule set on unchanged code.
dev = ["mutagen>=1.45", "numpy", "pytest==9.2.0", "ruff==0.17.3", "mypy==2.4.1", "coverage==7.16.2"]

[project.scripts]
pysacd = "pysacd.__main__:main"
pysacd-extract = "pysacd.extract:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
line-length = 120
target-version = "py310"

[tool.mypy]
python_version = "3.10"
ignore_missing_imports = true

# CI's coverage leg (ci.yml): the Python package only, with branch coverage
[tool.coverage.run]
source = ["pysacd"]
branch = true

[tool.coverage.report]
skip_empty = true
