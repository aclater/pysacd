[build-system]
requires = ["setuptools>=64"]
build-backend = "setuptools.build_meta"

[project]
name = "pysacd"
version = "0.1.0"
description = "Pure-Python SACD (Scarletbook) ISO TOC reader"
readme = "README.md"
requires-python = ">=3.10"
license = "GPL-2.0-or-later"
dependencies = []

[project.scripts]
pysacd = "pysacd.__main__:main"

[tool.setuptools.packages.find]
where = ["src"]
