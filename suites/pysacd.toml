# The pinned release quality suite for pysacd's PCM output (docs/development.md, "Release quality
# comparison"). tools/quality_compare.py runs it on the previous release and on the candidate, on the
# same machine, and writes docs/quality/<version>.md.
#
# The [suite] and [[device]] tables are a plain dsd-measure suite: it runs unchanged on each version,
# with that version's `pysacd` first on PATH and the repository root as the working directory.
# [pysacd_quality] is read only by tools/quality_compare.py (dsd-measure ignores it).

[suite]
name = "pysacd PCM output"
profile = "quick"
in_rate = 88200
out = "report"

# Inputs: the tool's own synthetic DSD64 test signals (its reference modulator), wrapped by
# tools/quality_device.py into a one-track plain-DSD SACD image with tests/sacdgen.py. No music.
# Each device runs `pysacd convert` on that image with one worker thread, no MusicBrainz, no cover.

[[device]]
name = "stereo FLAC 88.2 kHz"
adapter = "cli"
class = "A"
output_ext = "wav"
version_command = "pysacd --version"
command = "python3 -I tools/quality_device.py --format flac --rate 88200 --area stereo {input} {output}"

[[device]]
name = "stereo FLAC 176.4 kHz"
adapter = "cli"
class = "A"
output_ext = "wav"
version_command = "pysacd --version"
command = "python3 -I tools/quality_device.py --format flac --rate 176400 --area stereo {input} {output}"

# Multichannel: a 5.1 area whose channels carry the input pair in turn (L R L R L R); the surround
# pair (channels 5 and 6) is measured, the last channels in each frame.
[[device]]
name = "5.1 WAV 88.2 kHz"
adapter = "cli"
class = "A"
output_ext = "wav"
version_command = "pysacd --version"
command = "python3 -I tools/quality_device.py --format wav --rate 88200 --area multichannel --channels 5,6 {input} {output}"

[[device]]
name = "5.1 WAV 176.4 kHz"
adapter = "cli"
class = "A"
output_ext = "wav"
version_command = "pysacd --version"
command = "python3 -I tools/quality_device.py --format wav --rate 176400 --area multichannel --channels 5,6 {input} {output}"

[pysacd_quality]
# tools/quality_compare.py hands dsd-measure the tables above this one only, so editing anything
# from here on (a bound, a note) leaves the measured suite, and the reuse of reports, unchanged.
# dsd-measure version pin: 0.1.3 (tag v0.1.3). It records each device's version and executable hash,
# reads the word length of every output file, marks a comparison that is not like for like, and
# reports THD apart from SINAD. final is true from the first published comparison (pysacd
# 0.6.0 against 0.5.x, with dsd2pcm 0.2.0 as the PCM path); false marks a page a draft.
dsd_measure_version = "0.1.3"
dsd_measure_commit = "8010bbab950091cabffb20fb25e8a6a744569a6d"
dsd_measure_repository = "https://github.com/dsd-toolbox/dsd-measure"
final = true

# The output every device must write, read by dsd-measure from each file's header
# (metrics.output_format). Both versions must match it and each other, so that a comparison is
# 24-bit against 24-bit at the same rate; anything else voids the page.
[pysacd_quality.output]
kind = "int"
bits = 24

# The figures compared, each from every device's results.json. "better" says which way is an
# improvement. "bound" is the repeatability in dB: the spread of the figure over three dither draws
# of one build (the same signal shifted by 0, 1 and 2 idle frames, see [pysacd_quality.repeatability]),
# doubled and rounded up. A change within the bound is noise; a change beyond it is flagged, and a
# worse one is a regression. "floor_flag" names dsd-measure's flag for a figure within 6 dB of its
# reference floor (dsd_measure.floor.flags); such a figure is marked "floor" on the page.
# Re-derived on 2026-11-24 with dsd-measure 0.1.2 from master's draft run (the old C filter);
# largest spreads: SINAD 0.06 dB, THD 0.80 dB, noise 0.01 dB, alias 0.14 dB. With 0.1.1 (0.6.0's
# draft) they were SINAD and THD+N 0.10 dB, noise 0.02 dB, alias 0.11 dB; THD was not compared.
# THD at about -146 dB reads harmonics close to the dither noise, hence its wider bound.
[[pysacd_quality.metric]]
key = "sinad"
label = "SINAD (= -THD+N), 1 kHz at 0 dB SACD (dB)"
path = "metrics.tone_0dbsacd.sinad_db"
better = "higher"
bound = 0.2
floor_flag = "sinad"

[[pysacd_quality.metric]]
key = "thd"
label = "THD (harmonics 2 to 9), 1 kHz at 0 dB SACD (dB)"
path = "metrics.tone_0dbsacd.thd_db"
better = "lower"
bound = 1.7
floor_flag = "thd"

[[pysacd_quality.metric]]
key = "noise"
label = "Noise floor, 20 Hz to 20 kHz (dBFS)"
path = "metrics.noise.unweighted_dbfs"
better = "lower"
bound = 0.1
floor_flag = "noise"

[[pysacd_quality.metric]]
key = "alias"
label = "Alias rejection, worst image (dB)"
path = "metrics.alias_tones.worst_image_db"
better = "lower"
bound = 0.3

# Null test: each device's output from the previous release against the candidate's, on one
# synthetic music-like source (band-limited pink noise and tones, made by tools/quality_compare.py
# with the tool's reference modulator, its SHA-256 checked). Null depth = the source's level minus
# the difference's level, 20 Hz to 20 kHz. The bound is the depth of two dither draws of the
# candidate against each other: a release that differs from its predecessor by no more than the
# dither does reaches it (0.6.0's draft: within 0.3 dB on every output; bound set at 1 dB). With
# dsd-measure 0.1.2 both depths are limited by the 24-bit word length, which the page notes.
[pysacd_quality.null]
seconds = 20
seed = 20261124
# re-derived with dsd-measure 0.1.3 (8010bba): it changed from 0.1.2's 128f6ecb97a4060a (3eaec2d), the
# same as with 0.1.1 (d234b7a); same seed and recipe, so the tool's encoder or file writer changed
source_sha256 = "5defb0279817a9275117f541edc5abea71557729b56dd723ea785e7cea972669"
bound = 1.0

[pysacd_quality.repeatability]
lead_frames = [1, 2]
